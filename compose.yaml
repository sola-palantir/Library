# Windows control plane only: no media mounts or enabled worker transport.
name: library
services:
  library:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      Library__DataPath: /data
      Library__ExecutionBackend: windows-worker
      Library__Roots__0__Id: source
      Library__Roots__0__Label: Windows source (worker offline)
      Library__Roots__0__Role: source
      Library__Roots__0__ContainerPath: ""
      Library__Roots__0__WindowsPath: ""
      Library__Roots__1__Id: library
      Library__Roots__1__Label: Windows library (worker offline)
      Library__Roots__1__Role: library
      Library__Roots__1__ContainerPath: ""
      Library__Roots__1__WindowsPath: ""
      Library__Roots__2__Id: staging
      Library__Roots__2__Label: Windows staging (worker offline)
      Library__Roots__2__Role: staging
      Library__Roots__2__ContainerPath: ""
      Library__Roots__2__WindowsPath: ""
    volumes:
      - catalog:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  catalog:
