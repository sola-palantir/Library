name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet test tests/Library.Tests -c Release
        env:
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      - run: dotnet test companion/Library.Companion.Tests -c Release
      - run: dotnet publish companion/Library.Companion -c Release -r win-x64 --self-contained false
      - run: npm ci && npm run test:media && npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: |
          python3 scripts/synthetic-fixtures.py
          scripts/run-api.sh > /tmp/library-api.log 2>&1 &
          npm --prefix client run dev > /tmp/library-client.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5080/api/health && curl -fsS http://127.0.0.1:5173/ && break; sleep 1; done
          npm --prefix client run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots/
            client/test-results/

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet publish companion/Library.Companion -c Release -r win-x64 --self-contained false
      # Compilation only: no pairing, COM calls, device discovery or optical writes.
