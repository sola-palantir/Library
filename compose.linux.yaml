name: library
services:
  library:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      Library__DataPath: /data
      Library__ExecutionBackend: linux-local
      Library__Roots__0__Id: source
      Library__Roots__0__Label: Downloads (read-only)
      Library__Roots__0__ContainerPath: /media/source
      Library__Roots__0__WindowsPath: ${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}
      Library__Roots__0__Role: source
      Library__Roots__1__Id: library
      Library__Roots__1__Label: Organized library
      Library__Roots__1__ContainerPath: /media/library
      Library__Roots__1__WindowsPath: ${LIBRARY_PATH:?Set LIBRARY_PATH in .env}
      Library__Roots__1__Role: library
      Library__Roots__2__Id: staging
      Library__Roots__2__Label: Disc staging
      Library__Roots__2__ContainerPath: /media/staging
      Library__Roots__2__WindowsPath: ${STAGING_PATH:?Set STAGING_PATH in .env}
      Library__Roots__2__Role: staging
    volumes:
      - catalog:/data
      - type: bind
        source: ${DOWNLOADS_PATH}
        target: /media/source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIBRARY_PATH}
        target: /media/library
        bind:
          create_host_path: false
      - type: bind
        source: ${STAGING_PATH}
        target: /media/staging
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  catalog:
