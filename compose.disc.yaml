# Optional read-only overlay for legacy folder content checks only.
# A successful check records content-checked, never physical-disc verification.
# Native companion verification does not use this overlay.
# Apply only with the legacy compose.linux.yaml backend, never Windows-worker mode.
services:
  library:
    environment:
      Library__Roots__3__Id: disc
      Library__Roots__3__Label: Disc read-back
      Library__Roots__3__ContainerPath: /media/disc
      Library__Roots__3__WindowsPath: ${DISC_READBACK_PATH:?Set a real mounted disc path}
      Library__Roots__3__Role: disc
    volumes:
      - type: bind
        source: ${DISC_READBACK_PATH}
        target: /media/disc
        read_only: true
        bind:
          create_host_path: false
